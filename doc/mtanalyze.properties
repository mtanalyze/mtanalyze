# MT Analyze configuration file
# Place this file next to the MT-Analyze JAR to activate.
# All settings are optional — built-in defaults apply when absent.

# Maximum number of entries loaded per session.
# Increase for large statement files; decrease on low-memory machines.
# Default: 1000
#max.entries=1000

# Log file import: string that marks the start of an embedded SWIFT message.
# Default: {1:
#log.swift.start={1:

# Log file import: token used inside log entries to represent a newline
# within a multi-line SWIFT message.
# Default: \n
#log.newline.token=\n

# Enable experimental / work-in-progress features.
# Default: false
#experimental.mode=false

# Default Sender BIC used when exporting MT messages (8 or 11 chars, uppercase).
# Editable via Settings dialog; leave empty for no default.
#mt.export.sender=

# Default Receiver BIC used when exporting MT messages (8 or 11 chars, uppercase).
# Editable via Settings dialog; leave empty for no default.
#mt.export.receiver=