name: Release Build

on:
  release:
    types: [published, released, created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (z. B. v1.0.22)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode package -DskipTests

      - name: Rename JAR with release tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          mv target/MT-Analyze-*.jar "target/MT-Analyze-${TAG}.jar"

      - name: Upload JAR to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: target/MT-Analyze-*.jar